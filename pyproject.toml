[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-agent-fork"
version = "0.2.0"
description = "Cross-agent session fork: take a whole session from one agent and continue it in another (Claude Code / Codex / DeepSeek Harness), original untouched"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "cross-agent-fork contributors" }]

[project.scripts]
caf = "caf.cli:main"

[tool.setuptools]
packages = ["caf", "caf.adapters", "caf.plugins"]
