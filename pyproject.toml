[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-agent-fork"
version = "0.4.0"
description = "Fork a coding-agent session into another agent (Claude Code, Codex, DeepSeek Harness)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "cross-agent-fork contributors" }]
dependencies = ["zstandard"]

[project.scripts]
caf = "caf.cli:main"

[tool.setuptools]
packages = ["caf", "caf.adapters"]

[tool.setuptools.package-data]
caf = ["skills/caf/SKILL.md"]
